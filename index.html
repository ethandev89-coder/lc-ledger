<!doctype html>
<html lang="zh-Hant-TW">
<head>

<title>帳本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007AFF'/%3E%3Cpath d='M20 14h20a6 6 0 0 1 6 6v30H24a6 6 0 0 1-6-6V16' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M18 44a6 6 0 0 1 6-6h22' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
/* 版面：蘋果風（iOS 分組清單），一欄最寬 30rem；上方大標題＋右上「新增」，底部半透明分頁列，所有輸入都在底部彈出的表單裡 */
:root {
  --bg: #F2F2F7;
  --cell: #FFFFFF;
  --cell-press: #E5E5EA;
  --sheet-bg: #F2F2F7;
  --sheet-cell: #FFFFFF;
  --sheet-press: #E5E5EA;
  --fill: rgba(118, 118, 128, .12);
  --track: #E9E9EA;
  --knob: #FFFFFF;
  --seg-on: #FFFFFF;
  --label: #000000;
  --label-2: rgba(60, 60, 67, .62);
  --label-3: rgba(60, 60, 67, .32);
  --sep: rgba(60, 60, 67, .22);
  --blue: #007AFF;
  --tint-ink: #007AFF;
  --on-color: #FFFFFF;
  --blue-tint: rgba(0, 122, 255, .12);
  --green-t: #248A3D;
  --red-t: #D70015;
  --orange-t: #C93400;
  --orange-tint: rgba(255, 149, 0, .16);
  --c-blue: #007AFF;
  --c-green: #34C759;
  --c-orange: #FF9500;
  --c-indigo: #5856D6;
  --c-purple: #AF52DE;
  --c-gray: #8E8E93;
  --c-red: #FF3B30;
  --bar: rgba(249, 249, 249, .92);
  --scrim: rgba(0, 0, 0, .4);
  --hud: rgba(28, 28, 30, .9);
  --av-a: #A5ABB6;
  --av-b: #858A94;
  --shadow-seg: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04);
  --shadow-knob: 0 3px 8px rgba(0, 0, 0, .15), 0 3px 1px rgba(0, 0, 0, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Heiti TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
  --col: 30rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --cell: #1C1C1E; --cell-press: #2C2C2E;
    --sheet-bg: #1C1C1E; --sheet-cell: #2C2C2E; --sheet-press: #3A3A3C;
    --fill: rgba(118, 118, 128, .24); --track: #39393D; --knob: #FFFFFF; --seg-on: #636366;
    --label: #FFFFFF; --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .32); --sep: rgba(84, 84, 88, .6);
    --blue: #0A84FF; --tint-ink: #409CFF; --on-color: #FFFFFF; --blue-tint: rgba(10, 132, 255, .24);
    --green-t: #30D158; --red-t: #FF453A; --orange-t: #FF9F0A; --orange-tint: rgba(255, 159, 10, .2);
    --c-blue: #0A84FF; --c-green: #30D158; --c-orange: #FF9F0A; --c-indigo: #5E5CE6; --c-purple: #BF5AF2; --c-gray: #8E8E93; --c-red: #FF453A;
    --bar: rgba(22, 22, 24, .92); --scrim: rgba(0, 0, 0, .6); --hud: rgba(58, 58, 60, .95);
    --av-a: #6E737C; --av-b: #50545B;
    --shadow-seg: 0 3px 8px rgba(0, 0, 0, .3); --shadow-knob: 0 3px 8px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); color: var(--label); font: 400 17px/1.35 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
h1, h2, p { margin: 0; }

.app {
  max-width: var(--col); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px));
}
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.nav-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-height: 48px; }
.nb { min-width: 44px; min-height: 44px; padding: 10px 6px; border: 0; background: none; color: var(--blue); font-size: 17px; cursor: pointer; }
.nb.r { font-weight: 600; }
.nb.danger { color: var(--red-t); }
.nb:disabled { color: var(--label-3); cursor: default; }
.avatar { position: relative; flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: linear-gradient(180deg, var(--av-a), var(--av-b)); color: var(--on-color); font-size: 15px; font-weight: 600; cursor: pointer; }
.avatar::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; }
.ltitle { margin: 2px 0 16px; font-size: 34px; font-weight: 700; line-height: 1.2; letter-spacing: .01em; }

.hero { margin-bottom: 26px; padding: 18px 18px 14px; border-radius: 16px; background: var(--cell); }
.hero .k { font-size: 15px; font-weight: 500; color: var(--label-2); }
.hero .n { margin-top: 2px; font-size: 46px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.hero .n small { margin-left: 6px; font-size: 17px; font-weight: 600; color: var(--label-2); letter-spacing: 0; }
.hero .nt { margin-top: 8px; font-size: 15px; color: var(--label-2); }
.link { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; margin-top: 4px; padding: 0; border: 0; background: none; color: var(--blue); font-size: 15px; cursor: pointer; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.pos { color: var(--green-t); }
.neg { color: var(--red-t); }
.zero { color: var(--label-2); }

.grp { margin-bottom: 26px; }
.grp-h { padding: 0 16px 7px; font-size: 13px; color: var(--label-2); }
.grp-b { overflow: hidden; border-radius: 12px; background: var(--cell); }
.grp-f { padding: 7px 16px 0; font-size: 13px; line-height: 1.45; color: var(--label-2); }
.cell { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 11px 16px; }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.ic-row + .ic-row::before { left: 58px; }
button.cell { border: 0; background: none; text-align: left; cursor: pointer; }
.tap:active { background: var(--cell-press); }
.main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.main .t { font-size: 17px; }
.s { font-size: 15px; color: var(--label-2); }
.q { font-size: 15px; color: var(--label-2); }
.chev { flex: none; color: var(--label-3); }
.ic { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--on-color); }
.ic svg { width: 18px; height: 18px; }
.act { color: var(--blue); }
.danger { color: var(--red-t); }
.kv { align-items: flex-start; }
.kv .k { flex: none; }
.kv .v { flex: 1; min-width: 0; text-align: right; color: var(--label-2); }
.kv .v.strong { color: var(--label); font-weight: 600; }
.r { flex: none; margin-left: 4px; text-align: right; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.r.dim { color: var(--label-2); font-weight: 500; }
.bdg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; background: var(--orange-tint); color: var(--orange-t); font-size: 12px; font-weight: 600; }
.badge.gray { background: var(--fill); color: var(--label-2); }
.badge.new { background: var(--blue-tint); color: var(--tint-ink); }
.void .t, .void .r { color: var(--label-3); text-decoration: line-through; }
.foot { margin: 0 0 26px; padding: 0 16px; font-size: 13px; line-height: 1.45; color: var(--label-2); }
.foot.tight { margin-bottom: 14px; }
.lead { padding: 4px 4px 14px; font-size: 17px; line-height: 1.5; }

.ocell { display: grid; gap: 4px; padding: 14px 16px 16px; }
.ohead { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.prog { overflow: hidden; height: 6px; margin: 6px 0 4px; border-radius: 3px; background: var(--fill); }
.prog i { display: block; height: 100%; border-radius: 3px; background: var(--c-indigo); }
.prog.over i { background: var(--c-red); }
.ocell .s b { color: var(--label); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; }
.btn-sm { min-height: 38px; padding: 0 18px; border-radius: 19px; font-size: 15px; }
.btn-fill { background: var(--blue); color: var(--on-color); }
.btn-tint { background: var(--blue-tint); color: var(--tint-ink); }

.segc { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; padding: 2px; border-radius: 9px; background: var(--fill); }
.segc label { position: relative; min-width: 0; }
.segc input { position: absolute; opacity: 0; pointer-events: none; }
.segc span { display: block; width: 100%; padding: 7px 6px; border-radius: 7px; color: var(--label); font-size: 15px; font-weight: 500; text-align: center; white-space: nowrap; cursor: pointer; }
.segc input:checked + span { background: var(--seg-on); box-shadow: var(--shadow-seg); font-weight: 600; }
.segc input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 1px; }
.pick .k { flex: none; width: 5.2em; font-size: 15px; color: var(--label-2); }
.pick .segc { flex: 1; min-width: 0; }

.field .k { flex: none; min-width: 4.5em; }
.field input { flex: 1; min-width: 0; padding: 0; border: 0; background: none; color: var(--label); font: inherit; font-size: 17px; outline: none; }
.field input::placeholder, .amt-cell input::placeholder { color: var(--label-3); }
.field .sfx { flex: none; color: var(--label-2); }
.amt-cell { align-items: baseline; justify-content: center; gap: 6px; padding: 12px 16px 10px; }
.amt-cell input { width: 100%; min-width: 0; padding: 0; border: 0; background: none; color: var(--label); font: inherit; font-size: 34px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.amt-cell .u { flex: none; font-size: 17px; color: var(--label-2); }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; }
.qchip { min-height: 34px; padding: 0 12px; border: 0; border-radius: 17px; background: var(--fill); color: var(--label); font-size: 14px; font-weight: 500; cursor: pointer; }
.chk { cursor: pointer; }
.chk input { position: absolute; opacity: 0; pointer-events: none; }
.chk .t { flex: 1; }
.chk .mark { flex: none; color: var(--blue); font-weight: 700; visibility: hidden; }
.chk input:checked ~ .mark { visibility: visible; }
.chk input:focus-visible ~ .t { outline: 2px solid var(--blue); outline-offset: 2px; }
.sw .t { flex: 1; min-width: 0; }
.switch { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 51px; height: 31px; margin: 0; border-radius: 16px; background: var(--track); cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--knob); box-shadow: var(--shadow-knob); transition: transform .2s; }
.switch:checked { background: var(--c-green); }
.switch:checked::after { transform: translateX(20px); }
.sum { margin: 0 0 10px; padding: 12px 14px; border-radius: 12px; background: var(--blue-tint); font-size: 15px; line-height: 1.45; }
.sum .why { display: block; margin-top: 4px; font-size: 13px; color: var(--label-2); }
.need { min-height: 1.4em; padding: 0 16px; font-size: 13px; color: var(--label-2); }
.dhead { display: flex; align-items: center; gap: 12px; margin: 4px 4px 18px; }
.dhead .ic { width: 44px; height: 44px; border-radius: 11px; }
.dhead .ic svg { width: 24px; height: 24px; }
.dt { font-size: 20px; font-weight: 700; line-height: 1.3; }
.ds { font-size: 15px; color: var(--label-2); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar-in { display: grid; grid-template-columns: repeat(3, 1fr); max-width: calc(var(--col) - 32px); margin: 0 auto; }
.tab { display: grid; justify-items: center; gap: 1px; padding: 7px 0 5px; border: 0; background: none; color: var(--c-gray); font-size: 11px; font-weight: 500; cursor: pointer; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--blue); }

.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: relative; display: flex; flex-direction: column; overflow: hidden; width: 100%; max-width: var(--col); max-height: 92vh; max-height: 92dvh; border-radius: 14px 14px 0 0; background: var(--sheet-bg); }
.sheet .grp-b { background: var(--sheet-cell); }
.sheet .tap:active { background: var(--sheet-press); }
.sheet:focus { outline: none; }
@keyframes rise { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .25s cubic-bezier(.2, .8, .2, 1); } }
.grab { flex: none; width: 36px; height: 5px; margin: 6px auto 0; border-radius: 3px; background: var(--label-3); }
.sh-nav {
  flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 48px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.sh-nav > :first-child { justify-self: start; }
.sh-nav > :last-child { justify-self: end; }
.sh-nav h2 { max-width: 13em; overflow: hidden; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; text-overflow: ellipsis; }
.sh-body {
  flex: 1; overflow-y: auto; overscroll-behavior: contain;
  padding-block: 8px calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; transform: translateX(-50%);
  width: max-content; max-width: min(90vw, 26rem); padding: 12px 18px; border-radius: 14px;
  background: var(--hud); color: var(--on-color); font-size: 15px; font-weight: 500; text-align: center;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.toast { display: flex; align-items: center; justify-content: center; gap: 12px; }
.toast-btn { flex: none; min-height: 34px; padding: 0 14px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .2); color: var(--on-color); font-size: 15px; font-weight: 700; cursor: pointer; }
.ohead { width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.ohead:active { opacity: .6; }
.tip { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; padding: 14px 16px; border-radius: 14px; background: var(--blue-tint); }
.tip .main { gap: 4px; }
.tip .t { font-weight: 600; }
.tip .s { line-height: 1.45; }
.cell.sugg { display: block; }
.sugg-h { margin-bottom: 8px; font-size: 13px; color: var(--label-2); }
.ptr { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; z-index: 15; transform: translateX(-50%); padding: 6px 14px; border-radius: 16px; background: var(--hud); color: var(--on-color); font-size: 13px; font-weight: 600; pointer-events: none; }
@keyframes slideL { from { transform: translateX(28px); opacity: .35; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-28px); opacity: .35; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: no-preference) {
  .slide-l { animation: slideL .22s ease-out; }
  .slide-r { animation: slideR .22s ease-out; }
}
</style>
</head>
<body>
<div class="app">
  <div class="nav"><div class="nav-row">
    <button class="nb" id="navAct" type="button" data-act="new" hidden>新增</button>
    <button class="avatar" id="avatar" type="button" data-act="me" aria-haspopup="dialog" hidden></button>
  </div></div>
  <h1 class="ltitle" id="ltText">帳本</h1>
  <main id="view"></main>
</div>

<nav class="tabbar" id="tabbar" aria-label="分頁" hidden>
  <div class="tabbar-in">
    <button class="tab" type="button" data-act="tab" data-tab="ledger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg><span>帳本</span></button>
    <button class="tab" type="button" data-act="tab" data-tab="items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12l3 5-9 11L3 9z"/><path d="M3 9h18"/></svg><span>東西</span></button>
    <button class="tab" type="button" data-act="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg><span>紀錄</span></button>
  </div>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="scrim" data-act="close"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="ptr" id="ptr" aria-hidden="true" hidden>往下拉更新</div>

<script src="items.js"></script>
<script>
(() => {
'use strict';

/* ---------- 後台與身分：專屬網址 #k=代碼，第一次打開後記在這支手機 ---------- */
const API = 'https://script.google.com/macros/s/AKfycbxzEq5mXc9yk7nABc8rh47o_ycnjzV0RV1_A31OB76vWjsxa2pAaU0DVS3WQ-FqSUGS6g/exec';
const KEY_STORE = 'zhangben-key';
let KEY = '';
let M = [];
const CUR = { tb: '天幣', nt: '台幣' };
const TZ = 'Asia/Taipei';
const now = () => new Date().toISOString();
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// 同一個表單沒存成功再按一次時，沿用同一組編號，後台就不會記兩次
const idFor = (ctx, slot) => { ctx.ids = ctx.ids || {}; return ctx.ids[slot] || (ctx.ids[slot] = newId(slot === 'i' ? 'i' : 'e')); };
const S = { me: '', tab: 'ledger', seen: {}, entries: [], items: [], loaded: false, error: '' };
const TABS = ['ledger', 'items', 'log'];
const UA = navigator.userAgent || '';
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(UA));
const IS_ANDROID = /Android/i.test(UA);
// 從主畫面的圖示打開（沒有瀏覽器的網址列）
const STANDALONE = navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
const A2HS_KEY = 'zhangben-a2hs-ok';
// 官方百科的物品名稱（items.js）；打字時拿來提示正式名稱
const OFFICIAL = Array.isArray(window.OFFICIAL_ITEMS) ? window.OFFICIAL_ITEMS : [];
const OFFICIAL_SET = new Set(OFFICIAL);

function initKey() {

/* ---------- 格式：天幣寫成 1500、99萬9000、210萬 ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

/* ---------- 算帳：每筆記下就算數 ---------- */
const pair = (cred, debt, v) => v ? new Map([[cred, v], [debt, -v]]) : new Map();

    c[0].v -= x; d[0].v -= x;

}

/* ---------- 代購金：每批照實際價錢扣，收完再結算 ---------- */

const salesOf = i => S.entries.filter(e => e.itemId === i.id && e.type === 'split' && !e.voided);

// 存到後台：按鈕變「儲存中…」，成功就關掉表單並更新畫面，失敗就把原因寫在表單裡
async function save(call, msg, tabAfter, undoList) {
  if (saving) return;
  saving = true;
  const btn = sheet.querySelector('button[type="submit"]'), label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '儲存中…'; }
  try {
    const data = await call();
    applyData(data);
    saving = false;
    closeSheet();
    if (tabAfter) S.tab = tabAfter;
    render();
    toast(msg, undoList && undoList.length ? { label: '復原', run: () => undo(undoList) } : null);
  } catch (err) {
    saving = false;
    if (btn) { btn.disabled = false; btn.textContent = label; }
    const need = sheet.querySelector('.need');
    if (need) need.textContent = '沒存到：' + err.message; else toast('沒存到：' + err.message);
    load(true); // 背後順便抓最新的帳，關掉表單再看就是對的
  }
}
// 用過的物品名稱（最近的在前面）：打寶類跟打寶類放一起，代購／代墊跟代購／代墊放一起
function recentNames(type) {
  const buyish = type === 'order' || type === 'buy', src = [];
  for (const e of S.entries) if (!e.voided && e.item && (buyish ? e.type === 'order' || e.type === 'buy' : e.type === 'split')) src.push([e.t, e.item]);
  for (const i of S.items) if (i.status !== 'void' && (buyish ? i.kind === 'buy' : i.kind === 'loot')) src.push([i.t, i.name]);
  src.sort((a, b) => (a[0] < b[0] ? 1 : -1));
  return [...new Set(src.map(x => x[1]))].slice(0, 8);
}
// 名稱提示：沒打字時列出最近用過的；有打字時先找用過的，再找官方百科（「31F」「31樓」都找得到「…(31樓)」）
function suggestNames(type, v) {
  const q = v.trim(), recent = recentNames(type);
  if (!q) return { label: recent.length ? '最近用過' : '', list: recent };
  const toks = q.replace(/(\d)\s*[fF樓]/g, '$1 ').match(/\d+|[^\d\s()（）,，、]+/g) || [];
  const hit = n => toks.every(t => n.includes(t));
  const out = [], seen = new Set([q]);
  const push = n => { if (!seen.has(n)) { seen.add(n); out.push(n); } };
  recent.filter(hit).forEach(push);
  OFFICIAL.filter(n => n.startsWith(q)).forEach(push);
  OFFICIAL.filter(hit).forEach(push);
  return { label: out.length ? '點一下就填好（百科正式名稱優先用）' : '', list: out.slice(0, 8) };
}
// 剛記下的那幾筆，按「復原」時要作廢的順序：後記的先作廢；跟帳一起記的東西，後台會跟著作廢
const undoOf = p => {
  const es = p.entries || [], is = p.items || [];
  return es.slice().reverse().map(e => ({ kind: 'e', id: e.id }))
    .concat(is.filter(i => i.kind === 'loot' && !es.some(e => e.itemId === i.id)).map(i => ({ kind: 'i', id: i.id })));
};
async function undo(list) {
  toast('復原中…');
  try {
    let d = null;
    for (const x of list) d = await api('void', { kind: x.kind, id: x.id, reason: '剛記錯，按了復原' });
    if (d) applyData(d);
    render();
    toast('已復原：剛剛那筆已作廢');
  } catch (err) {
    toast('沒復原成功：' + err.message);
    load(true);
  }
}
function submitForm(ctx) {
  const r = refresh(ctx);
  if (!r.ok) return;
  const d = ctx.d, payload = { entries: [], items: [] };
  let msg;
  if (ctx.type === 'loot') {
    payload.items.push({ id: idFor(ctx, 'i'), name: d.item, kind: 'loot', qty: r.qty, holder: d.from, owners: d.to.slice() });
    msg = `記好了：「${d.item}」放進東西清單`;
  } else {
    const e = Object.assign({ id: idFor(ctx, 'e'), note: d.note }, r.e);
    if (ctx.type === 'buy' && d.keep) {
      const it = { id: idFor(ctx, 'i'), name: e.item, kind: 'buy', qty: 1, holder: e.from, owners: [e.to[0]] };
      payload.items.push(it); e.itemId = it.id;
    } else if (ctx.type === 'sell') {
      const it = { id: idFor(ctx, 'i'), name: e.item, kind: 'loot', qty: r.qty, holder: e.from, owners: e.to.slice(), direct: true };
      payload.items.push(it); e.itemId = it.id;
    } else if (ctx.item) {
      e.itemId = ctx.item.id;
    }
    payload.entries.push(e);
    msg = `記好了：${title(e)}`;
  }
  save(() => api('add', payload), msg, ctx.type === 'loot' ? 'items' : null, undoOf(payload));
}

let toastTimer;
// 底部的提示；action = { label, run } 時多一顆按鈕（例如「復原」），停久一點
function toast(msg, action) {
  const el = $('#toast');
  el.textContent = '';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if (action) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'toast-btn'; btn.textContent = action.label;
    btn.addEventListener('click', () => { clearTimeout(toastTimer); el.hidden = true; action.run(); });
    el.appendChild(btn);
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 6000 : 2600);
}

  S.tab = tab;
  render();
  window.scrollTo(0, 0);
  view.classList.remove('slide-l', 'slide-r');
  if (dir) { void view.offsetWidth; view.classList.add(dir === 'next' ? 'slide-l' : 'slide-r'); }
}

/* ---------- 事件 ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'tab') goTab(b.dataset.tab);
  else if (a === 'reload') { if (SH) closeSheet(); S.error = ''; render(); load().then(good => { if (good) toast('帳本已更新'); }); }
  else if (!S.loaded) return;
  else if (a === 'new') { if (b.dataset.type) openForm(b.dataset.type); else openSheet({ k: 'pick' }); }
  else if (a === 'pick') openForm(b.dataset.type);
  else if (a === 'me') openSheet({ k: 'me' });
  else if (a === 'close') { if (!saving) closeSheet(); }
  else if (a === 'calc') openSheet({ k: 'calc' });
  else if (a === 'order') { const o = findE(b.dataset.id); if (o) openSheet({ k: 'order', o }); }
  else if (a === 'pickname') {
    const inp = sheet.querySelector('#f-item');
    if (inp && SH && SH.k === 'form') { inp.value = b.dataset.v; inp.blur(); refresh(SH); }
  }
  else if (a === 'a2hs-ok') { try { localStorage.setItem(A2HS_KEY, '1'); } catch (_) {} render(); }
  else if (a === 'item') { const it = findI(b.dataset.item); if (it) openSheet({ k: 'item', item: it }); }
  else if (a === 'rec') { const e = findE(b.dataset.id); if (e) openSheet({ k: 'rec', e }); }
  else if (a === 'void') openSheet(b.dataset.id ? { k: 'void', e: findE(b.dataset.id) } : { k: 'void', item: findI(b.dataset.item) });
  else if (a === 'addamt') {
    const inp = sheet.querySelector('#f-amt');
    if (!inp || !SH || SH.k !== 'form') return;
    const v = Number(b.dataset.v);
    inp.value = v ? String((parseAmt(inp.value, SH.d.cur) || 0) + v) : '';
    refresh(SH);
  }
  else if (a === 'sell') {
    const it = findI(b.dataset.item);
    openSheet({ k: 'form', type: 'isell', item: it, d: { from: it.holder, to: it.owners.slice(), cur: 'tb', amt: '', item: it.name, note: '', keep: false, qty: '1' } });
  } else if (a === 'keep') {
    const it = findI(b.dataset.item);
    openSheet({ k: 'form', type: 'ikeep', item: it, d: { from: it.owners.includes(S.me) ? S.me : it.owners[0], to: it.owners.slice(), cur: 'tb', amt: '', item: it.name, note: '', keep: false, qty: '1' } });
  } else if (a === 'hand') openSheet({ k: 'hand', item: findI(b.dataset.item) });
  else if (a === 'o-buy') openSheet({ k: 'obuy', o: findE(b.dataset.id) });
  else if (a === 'o-deliver') openSheet({ k: 'odeliver', o: findE(b.dataset.id) });
  else if (a === 'o-end') openSheet({ k: 'oend', o: findE(b.dataset.id) });
  else if (a === 'settle') {
    const me = S.me, dir = b.dataset.dir;
    const cands = ['tb', 'nt'].flatMap(c => plan(nets(c)).map(x => ({ ...x, cur: c }))).filter(x => (dir === 'pay' ? x.from === me : x.to === me));
    if (cands.length) openSheet({ k: 'settle', cands, sel: 0 });
  }
});
// 點進已經有數字的欄位時，整個選起來，直接打就會取代，不會接在後面
sheet.addEventListener('focusin', ev => {
  const t = ev.target;
  if (t.matches && t.matches('input[inputmode]') && t.value) setTimeout(() => { try { t.select(); } catch (_) {} }, 0);
});
sheet.addEventListener('input', () => {
  if (!SH || saving) return;
  if (SH.k === 'form') refresh(SH);
  else if (MINI[SH.k]) miniRefresh(SH);
  else if (SH.k === 'void') sheet.querySelector('#v-ok').disabled = !sheet.querySelector('#v-reason').value.trim();
});
sheet.addEventListener('change', ev => {
  if (!SH || saving) return;
  const tg = ev.target;
  if (SH.k === 'form') {
    // 兩個人時，兩邊選成同一個人，就自動把另一邊換成對方
    const L = LABELS[SH.type];
    if (M.length === 2 && L.to && !L.multi && (tg.name === 'from' || tg.name === 'to')) {
      const f = sheet.querySelector('input[name="from"]:checked'), to = sheet.querySelector('input[name="to"]:checked');
      if (f && to && f.value === to.value) {
        const other = M.find(p => p !== tg.value), side = tg.name === 'from' ? 'to' : 'from';
        const el = [...sheet.querySelectorAll(`input[name="${side}"]`)].find(x => x.value === other);
        if (el) el.checked = true;
      }
    }
    refresh(SH);
  } else if (SH.k === 'settle' && tg.name === 'cand') {
    SH.sel = Number(tg.value); SH.ids = null; openSheet(SH);
  }
});
sheet.addEventListener('submit', ev => {
  ev.preventDefault();
  if (!SH || saving) return;
  if (SH.k === 'form') { submitForm(SH); return; }
  if (MINI[SH.k]) {
    const r = miniRefresh(SH);
    if (!r.ok) return;
    if (SH.k === 'settle') {
      const e = { id: idFor(SH, 'e'), type: 'repay', from: r.x.from, to: [r.x.to], amt: r.amt, cur: r.x.cur, item: '', note: r.full ? '結清' : '', settle: true };
      save(() => api('add', { entries: [e] }), `記好了：${title(e)} ${moneyFull(e.amt, e.cur)}`, null, undoOf({ entries: [e] }));
      return;
    }
    const o = SH.o, u = unitOf(o.item), agent = o.to[0], buyer = o.from;
    const common = { orderId: o.id, item: o.item, cur: o.cur, note: '' };
    if (SH.k === 'obuy') {
      const list = [Object.assign({ id: idFor(SH, 'e'), type: 'obuy', from: agent, to: [buyer], qty: r.qty, unit: r.unit, amt: r.amt }, common)];
      if (sheet.querySelector('#b-del').checked) list.push(Object.assign({ id: idFor(SH, 'd'), type: 'deliver', from: agent, to: [buyer], qty: r.qty, amt: 0 }, common));
      save(() => api('add', { entries: list }), `記好了：收了 ${r.qty} ${u}，花 ${moneyFull(r.amt, o.cur)}`, null, undoOf({ entries: list }));
    } else if (SH.k === 'odeliver') {
      const de = Object.assign({ id: idFor(SH, 'e'), type: 'deliver', from: agent, to: [buyer], qty: r.k, amt: 0 }, common);
      save(() => api('add', { entries: [de] }), `記好了：${agent} 交給 ${buyer}「${o.item}」${r.k} ${u}`, null, undoOf({ entries: [de] }));
    } else {
      const left = r.left;
      const oe = Object.assign({ id: idFor(SH, 'e'), type: 'oend', from: left >= 0 ? buyer : agent, to: [left >= 0 ? agent : buyer], amt: Math.abs(left), refund: left >= 0 }, common);
      save(() => api('add', { entries: [oe] }),
        left > 0 ? `記好了：${agent} 要退 ${buyer} ${moneyFull(left, o.cur)}` : left < 0 ? `記好了：${buyer} 要補 ${agent} ${moneyFull(-left, o.cur)}` : '記好了：剛好用完', null, undoOf({ entries: [oe] }));
    }
  } else if (SH.k === 'hand') {
    const i = SH.item;
    save(() => api('hand', { id: i.id }), `記好了：「${i.name}」交給 ${i.owners[0]}`);
  } else if (SH.k === 'void') {
    const reason = sheet.querySelector('#v-reason').value.trim();
    if (!reason) return;
    save(() => api('void', SH.e ? { kind: 'e', id: SH.e.id, reason } : { kind: 'i', id: SH.item.id, reason }), '已作廢，紀錄還留著');
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !wrap.hidden && !saving) closeSheet(); });
// 面板往下滑就關掉（跟 iPhone 一樣）：從上方橫槓、標題列拉，或內容已經捲到最上面時往下拉
(() => {
  const scrim = wrap.querySelector('.scrim');
  let armed = false, dragging = false, startY = 0, startT = 0, dy = 0;
  const reset = () => { sheet.style.transition = ''; sheet.style.transform = ''; scrim.style.transition = ''; scrim.style.opacity = ''; };
  sheet.addEventListener('touchstart', ev => {
    armed = false;
    if (saving || ev.touches.length !== 1) return;
    const t = ev.target, b = sheet.querySelector('.sh-body');
    armed = !!t.closest('.grab, .sh-nav') || (!!b && b.contains(t) && b.scrollTop <= 0);
    if (!armed) return;
    startY = ev.touches[0].clientY; startT = Date.now(); dy = 0; dragging = false;
  }, { passive: true });
  sheet.addEventListener('touchmove', ev => {
    if (!armed) return;
    const d = ev.touches[0].clientY - startY;
    if (!dragging) {
      if (d < -4) { armed = false; return; } // 往上滑：照常捲動內容
      if (d < 8) return;
      dragging = true;
      sheet.style.transition = 'none'; scrim.style.transition = 'none';
    }
    dy = Math.max(0, d);
    sheet.style.transform = `translateY(${dy}px)`;
    scrim.style.opacity = String(Math.max(0, 1 - dy / sheet.offsetHeight));
    ev.preventDefault();
  }, { passive: false });
  const end = () => {
    if (!armed) return;
    armed = false;
    if (!dragging) return;
    dragging = false;
    const h = sheet.offsetHeight, fast = dy > 40 && dy / Math.max(1, Date.now() - startT) > 0.6;
    sheet.style.transition = 'transform .2s ease'; scrim.style.transition = 'opacity .2s ease';
    if (!saving && (dy > Math.min(140, h * 0.3) || fast)) {
      sheet.style.transform = `translateY(${h}px)`; scrim.style.opacity = '0';
      setTimeout(() => { reset(); closeSheet(); }, 190);
    } else {
      sheet.style.transform = ''; scrim.style.opacity = '';
      setTimeout(reset, 210);
    }
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
})();
// 回到這個網頁、或每分鐘一次，抓對方新記的帳（有表單打開時先不動）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') leaveLog(true);
  else if (wrap.hidden) load(true);
});
setInterval(() => { if (document.visibilityState === 'visible' && wrap.hidden && S.loaded) load(true); }, 60000);

// 左右滑換分頁（沒開面板時）：往左滑到下一頁、往右滑回上一頁；螢幕最邊邊留給瀏覽器的「上一頁」手勢
(() => {
  let sx = 0, sy = 0, st = 0, on = false;
  document.addEventListener('touchstart', ev => {
    on = false;
    if (!wrap.hidden || !S.loaded || ev.touches.length !== 1) return;
    const t = ev.touches[0];
    if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
    sx = t.clientX; sy = t.clientY; st = Date.now(); on = true;
  }, { passive: true });
  document.addEventListener('touchend', ev => {
    if (!on) return;
    on = false;
    const t = ev.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - st > 800) return;
    const i = TABS.indexOf(S.tab) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < TABS.length) goTab(TABS[i], dx < 0 ? 'next' : 'prev');
  }, { passive: true });
})();
// 從主畫面打開時沒有瀏覽器的重新整理：在最上面往下拉就更新（在瀏覽器裡就用瀏覽器自己的下拉重新整理）
(() => {
  if (!STANDALONE) return;
  const ptr = $('#ptr');
  let sx = 0, sy = 0, dist = 0, on = false;
  document.addEventListener('touchstart', ev => {
    on = wrap.hidden && S.loaded && window.scrollY <= 0 && ev.touches.length === 1;
    if (on) { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; dist = 0; }
  }, { passive: true });
  document.addEventListener('touchmove', ev => {
    if (!on) return;
    const t = ev.touches[0];
    dist = t.clientY - sy;
    if (Math.abs(t.clientX - sx) > Math.abs(dist)) { on = false; ptr.hidden = true; return; }
    if (dist < 12) { ptr.hidden = true; return; }
    ptr.hidden = false;
    ptr.textContent = dist > 80 ? '放開就更新' : '往下拉更新';
    ptr.style.opacity = String(Math.min(1, dist / 80));
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!on) return;
    on = false;
    if (dist > 80) {
      ptr.textContent = '更新中…'; ptr.style.opacity = '1';
      load().then(good => { ptr.hidden = true; if (good) toast('帳本已更新'); });
    } else ptr.hidden = true;
  }, { passive: true });
})();

initKey();
render();
load();
})();
</script>
</body>
